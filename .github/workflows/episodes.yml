# Fraîcheur des épisodes (plan §5.5) : toutes les 6 h, `dist/episodes/` est
# reconstruit puis le site est redéployé. L'implémentation vit dans `pages.yml`
# (appelée en `workflow_call`) : une seule source de vérité pour le build.
#
# En cas d'échec, le dernier déploiement valide reste en ligne (Pages ne remplace
# jamais un site par un build cassé).
name: Épisodes

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    name: Reconstruire et redéployer
    uses: ./.github/workflows/pages.yml
