# Fraîcheur des épisodes (plan §5.5) : toutes les 6 h, `dist/episodes/` est
# reconstruit puis le site est redéployé. L'implémentation vit dans `pages.yml`
# (appelée en `workflow_call`) : une seule source de vérité pour le build.
#
# En cas d'échec, le dernier déploiement valide reste en ligne (Pages ne remplace
# jamais un site par un build cassé).
name: Épisodes

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# ⚠️ Aucun `concurrency` ici : `pages.yml` (workflow appelé) en définit déjà un
# (groupe `pages`). Les deux blocs au même niveau formeraient le même groupe et
# GitHub détecterait un deadlock (« Canceling since a deadlock was detected for
# concurrency group: 'pages' between a top level workflow and ... ») en annulant
# l'exécution avant même le premier job. La file d'attente unique des déploiements
# est portée par `pages.yml`, seule source de vérité.

jobs:
  refresh:
    name: Reconstruire et redéployer
    uses: ./.github/workflows/pages.yml
