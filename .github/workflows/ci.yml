# Validation bloquante sur toute PR (plan §7).
#
#   Niveau 1 — structure (S1…S9) + S8 artefacts   < 5 s
#   Niveau 2 — doublons  (D1…D4) sur tout le dépôt < 5 s
#   Niveau 3 — flux RSS  uniquement les flux modifiés (cache 24 h)
#
# Échappatoire mainteneur : label `ci:skip-network` (réservé via CODEOWNERS) →
# saute le niveau 3 et tolère un dist incomplet quand un flux tiers est en panne.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Structure · doublons · flux
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      # `push` n'a pas d'événement PR : la condition court-circuite avant de lire les labels
      SKIP_NETWORK: ${{ github.event_name == 'pull_request' && contains(github.event.pull-request.labels.*.name, 'ci:skip-network') }}
    steps:
      - uses: actions/checkout@v4
        with:
          # niveau 2 : comparaison à l'intégralité de l'historique (base `main`)
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Schémas non dérivés (S9)
        run: |
          pnpm gen:types
          if ! git diff --exit-code schema/; then
            echo '::error::schema/ a été édité à la main — lancez « pnpm gen:types » et committez le résultat'
            exit 1
          fi

      - name: TypeScript
        run: pnpm typecheck

      - name: TypeScript du site (astro check)
        run: pnpm --filter site check

      - name: Formatage (prettier --check)
        run: pnpm lint

      - name: Structure + doublons (S1…S9, D1…D4)
        run: pnpm validate --report feed-report.md

      - name: Cache des flux (24 h)
        uses: actions/cache@v4
        with:
          path: .cache/feeds
          key: feeds-${{ github.run_id }}
          restore-keys: feeds-

      - name: Construire dist/
        run: pnpm build ${{ env.SKIP_NETWORK == 'true' && '--allow-incomplete' || '' }}

      - name: Artefacts conformes (S8)
        if: env.SKIP_NETWORK != 'true'
        run: pnpm validate:dist

      - name: Vérifier les flux modifiés (niveau 3)
        if: env.SKIP_NETWORK != 'true'
        run: pnpm validate:changed --report feed-report.md

      - name: Résumé en commentaire de PR
        if: github.event_name == 'pull_request' && hashFiles('feed-report.md') != ''
        continue-on-error: true # PR venant d'un fork : token en lecture seule
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- yoto-podcast-catalog:rapport-flux -->';
            const report = fs.readFileSync('feed-report.md', 'utf8').trim();
            const body = [
              marker,
              '## Rapport de validation des flux',
              '',
              report,
              '',
              '_Niveau 3 sur les flux modifiés par cette PR (les avertissements ne bloquent pas)._',
            ].join('\n');
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
            }
