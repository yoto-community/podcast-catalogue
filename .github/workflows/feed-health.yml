# Audit hebdomadaire de TOUS les flux (plan §7.4) : c'est lui qui détecte les flux
# devenus morts après contribution. Un seul rapport = une seule issue `feed-health`
# (ouverte/mise à jour en cas d'erreur, fermée au retour au vert) — pas de spam.
# Génère aussi .cache/feed-health.json commité pour la page /health/ du site.
name: Santé des flux

on:
  schedule:
    - cron: "0 4 * * 1" # lundi 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: feed-health
  cancel-in-progress: false

jobs:
  check:
    name: Vérifier les 133 flux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Cache des flux
        uses: actions/cache@v4
        with:
          path: .cache/feeds
          key: feeds-${{ github.run_id }}
          restore-keys: feeds-

      - name: Vérifier tous les flux et tenir l'issue à jour
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm check-feeds

      - name: Configurer git pour commit du cache
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit et push du cache feed-health
        if: always() && github.event_name == 'schedule'
        run: |
          if [ -f .cache/feed-health.json ]; then
            # -f : le fichier est exceptionnellement versionné (voir .gitignore)
            git add -f .cache/feed-health.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: update feed-health cache [skip ci]"
              git push
              echo "✅ Cache feed-health commité et poussé"
            else
              echo "ℹ️  Cache feed-health inchangé"
            fi
          else
            echo "⚠️  Pas de fichier cache généré"
          fi

      - name: Publier le rapport comme artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-flux
          path: ${{ runner.temp }}/yoto-podcast-catalog-feed-health.md
          if-no-files-found: ignore
